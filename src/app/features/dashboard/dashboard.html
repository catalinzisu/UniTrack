<nz-layout class="app-layout">
  <nz-sider nzCollapsible nzWidth="200px">
    <div class="logo">
      <h1>UniTrack</h1>
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/dashboard/subjects" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="dashboard"></span>
        <span>Dashboard</span>
      </li>

      <li nz-menu-item routerLink="/dashboard/profile" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="profile"></span>
        <span>Profile</span>
      </li>
    </ul>
  </nz-sider>
  <nz-layout>
    <nz-header class="app-header">
      <div class="header-content">
        <h2>Welcome back, {{ user()?.firstName }}!</h2>
        <button nz-button nzType="default" nzDanger (click)="logout()">
          <span nz-icon nzType="logout"></span> Logout
        </button>
      </div>
    </nz-header>
    <nz-content>
      <div class="inner-content">
        <div nz-row [nzGutter]="[16, 16]" class="stats-row">
          <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
            <nz-card>
              <div class="stat-card">
                <span nz-icon nzType="read" class="stat-icon"></span>
                <div class="stat-info">
                  <h3>{{ subjectsCount() }}</h3>
                  <p>Enrolled Subjects</p>
                </div>
              </div>
            </nz-card>
          </div>
          <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
            <nz-card>
              <div class="stat-card">
                <span nz-icon nzType="bank" class="stat-icon"></span>
                <div class="stat-info">
                  <h3>{{ user()?.faculty }}</h3>
                  <p>Faculty</p>
                </div>
              </div>
            </nz-card>
          </div>
          <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="8">
            <nz-card>
              <div class="stat-card">
                <span nz-icon nzType="schedule" class="stat-icon"></span>
                <div class="stat-info">
                  <h3>Year {{ user()?.studyYear }}</h3>
                  <p>Study Year</p>
                </div>
              </div>
            </nz-card>
          </div>
        </div>

        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
